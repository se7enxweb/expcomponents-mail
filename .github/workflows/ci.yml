name: CI

on:
  # Run on all pushes and on all pull requests.
  push:
  pull_request:
  # Allow manually triggering the workflow.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # Keys:
      # - experimental: Whether the build is "allowed to fail".
      matrix:
        php: ['7.3', '7.4', '8.0', '8.1', '8.2', '8.3']
        experimental: [false]

        include:
          - php: '8.4'
            experimental: true
          - php: '8.5'
            experimental: true

    name: "PHP: ${{ matrix.php }}"

    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: error_reporting=-1, display_errors=On, log_errors_max_len=0
          coverage: none
          tools: none

      # Install dependencies and handle caching in one go.
      # @link https://github.com/marketplace/actions/install-composer-dependencies
      - name: Use sibling forks without a Packagist release from GitHub
        # Changes only this checkout's composer.json, and only for a fork that has
        # no release on Packagist yet; released forks resolve as users get them.
        run: |
          todo=$(jq -r '((.require // {}) + (."require-dev" // {})) | keys[] | select(startswith("se7enxweb/expcomponents-"))' composer.json)
          seen=" "
          while [ -n "$(echo $todo)" ]; do
            set -- $todo; pkg=$1; shift; todo="$*"
            case "$seen" in *" $pkg "*) continue ;; esac
            seen="$seen$pkg "
            name=${pkg#se7enxweb/}
            if curl -sf -o /dev/null "https://repo.packagist.org/p2/$pkg.json"; then
              echo "$pkg: released on Packagist"
            else
              url="https://github.com/se7enxweb/$name"
              ver=$(git ls-remote --tags --refs "$url" | sed 's#.*refs/tags/##' | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)
              echo "$pkg: no release on Packagist yet, using dev-master of $url as $ver"
              composer config "repositories.$name" "{\"type\": \"vcs\", \"url\": \"$url\", \"no-api\": true}"
              composer require --no-update --no-interaction "$pkg:dev-master as $ver"
            fi
            todo="$todo $(curl -sf "https://raw.githubusercontent.com/se7enxweb/$name/HEAD/composer.json" | jq -r '(.require // {}) | keys[] | select(startswith("se7enxweb/expcomponents-"))')"
          done

      - name: "Install Composer dependencies (PHP < 8.4)"
        if: ${{ matrix.php < '8.4' }}
        uses: "ramsey/composer-install@v1"

      - name: "Install Composer dependencies (PHP 8.4)"
        if: ${{ matrix.php >= '8.4' }}
        uses: "ramsey/composer-install@v1"
        with:
          composer-options: --ignore-platform-reqs

      - name: Run unit tests
        run: vendor/bin/phpunit
